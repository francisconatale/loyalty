site_name: Loyalty Engine Docs
site_description: Core Loyalty & Customer Automation Platform Documentation
site_author: Loyalty Engine Team

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Arquitectura Core:
      - Visión y Arquitectura: architecture/overview.md
      - Constitución y Principios: architecture/constitution.md
      - Seguridad Multi-Cadena: architecture/security.md
      - Event Inbox e Idempotencia: architecture/event-inbox.md
  - Modelo de Dominio:
      - Resumen del Modelo: domain/overview.md
      - Tenants e Integraciones POS: domain/tenants-integrations.md
      - Clientes, Compras y Métricas: domain/customers-purchases.md
      - Programas de Puntos y Ledger: domain/loyalty-ledger.md
      - Recompensas y Cupones: domain/rewards-coupons.md
      - Motor de Automatizaciones: domain/automations.md
  - Contratos de Integración:
      - Ingesta Directa de Eventos: contracts/pos-events.md
      - Cupones y Canje en Caja: contracts/coupons.md
      - API REST de Clientes y Puntos: contracts/customer-loyalty.md
  - Guías y Estándares:
      - Validación Rápida (Quickstart): guides/quickstart.md
      - Estándares Zero-Boilerplate: guides/zero-boilerplate.md
